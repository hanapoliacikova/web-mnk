[build]
  publish = "."

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"


# Česká verzia: doména marketingnaklic.cz servíruje obsah z priečinka /cz
# Spoločné súbory (obrázky, CSS, JS, favicon) idú z koreňa webu.
[[redirects]]
  from = "https://www.marketingnaklic.cz/*"
  to = "https://marketingnaklic.cz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://marketingnaklic.cz/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://marketingnaklic.cz/favicon.ico"
  to = "/favicon.ico"
  status = 200
  force = true

[[redirects]]
  from = "https://marketingnaklic.cz/*"
  to = "/cz/:splat"
  status = 200
  force = true


# Schvaľovanie kreatív: každá adresa /schvalovanie/<klient>/ ukáže spoločnú stránku,
# ktorá si načíta /schvalovanie/<klient>/kampan.json. Existujúce súbory (prehlad, obrázky) majú prednosť.
[[headers]]
  for = "/schvalovanie/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=0, must-revalidate"

# Netlify porovnáva adresy s lomkou aj bez nej rovnako, preto stačí jedno pravidlo
# (samostatné presmerovanie na adresu s lomkou by sa zacyklilo).
[[redirects]]
  from = "/schvalovanie/:klient/"
  to = "/schvalovanie/_stranka.html"
  status = 200

# Interné stránky tímu: nikdy do vyhľadávačov
[[headers]]
  for = "/interne/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=0, must-revalidate"

# Súbory projektu, ktoré nemajú byť verejné
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
